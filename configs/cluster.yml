# Server template: one compute-node job runs one complete 500-question experiment.
# Replace null paths with server locations; do not insert development-machine paths.
profile: cluster
paths:
  data_root: null       # Read-only shared Data directory on the CPU storage node
  serialized_root: null
  chunks_root: null
  indexes_root: null    # Shared read-only indexes; each compute job loads its own instance
  runs_root: null       # Persistent writable results; each experiment owns a separate run directory
  model_cache: null
execution:
  conda_env: Hero
  device: cuda
  gpu_device: null      # Follow the compute job GPU allocation
  embedding_batch_size: null  # inherit method batch_size=1 unless explicitly overridden
  generation_concurrency: 1  # A100 80GB long-context trial; raise only after memory validation
experiment_unit: full_dataset_per_task
# No CPU query service, question sharding, or cross-node answer merging.
# NavReg formal experiments resolve to the official Qwen cluster_fp8 profile with BF16 KV cache.
