[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hero-navreg"
version = "0.1.0"
description = "Hero Dataset Naive RAG baseline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.3,<2.4",
  "torch==2.14.0",
  "sentence-transformers>=6.3,<7",
  "transformers>=5.16.1,<5.21",
  "huggingface-hub>=2.4,<3",
  "tqdm>=4.70,<5",
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<1",
  "vllm==0.33.0",
]

# GPU Faiss and the matching CUDA/PyTorch build are installed through the supplied
# Conda environment. Do not install a second CPU-only Faiss wheel alongside them.
[tool.setuptools.packages.find]
where = ["src"]
