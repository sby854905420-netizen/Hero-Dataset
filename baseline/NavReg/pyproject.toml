[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hero-navreg"
version = "0.1.0"
description = "Hero Dataset Naive RAG baseline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.3,<2.4",
  "torch==2.14.0",
  "transformers==5.20.2",
  "huggingface-hub>=2.4,<3",
  "tqdm>=4.70,<5",
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<1",
  "accelerate>=1.10,<2",
  "bitsandbytes==0.50.2",
  "sentencepiece>=0.2.3,<0.3",
]

# GPU Faiss and the matching CUDA/PyTorch build are installed through the supplied
# Conda environment. Do not install a second CPU-only Faiss wheel alongside them.
[tool.setuptools.packages.find]
where = ["src"]
