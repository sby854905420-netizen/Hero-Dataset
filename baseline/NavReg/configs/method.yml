# Shared method protocol; hardware budgets still require actual GPU trials.
name: NavReg
method: Naive RAG
status: first_implementation

serialization:
  version: navreg-fixed-serialization-v2
  kg: subject_relation_value_qualifiers_rank
  table: markdown_with_page_section_headers_and_original_row_coordinates
  infobox: page_section_and_field_value_pairs
  input_scope: complete_corpus_without_qa_or_gold

embedding_models:
  m3:
    model_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    dimensions: 1024
    max_input_tokens: 8192
    query_prefix: ''
    passage_prefix: ''
    dense: true
    sparse: false
    colbert: false
  device: cuda
  metadata_checked_on: '2026-11-14'
  pooling: cls_from_official_model_modules
  normalize_embeddings: true
  precision: float32  # the published model config defaults to float32
  batch_size: 1  # conservative startup default; tune explicitly after GPU trial

chunking:
  protocol: per_embedding_model_max_input_cell_prefix100_v2
  token_budget_source: embedding_models.m3.max_input_tokens
  tokenizer: native_bge_m3_tokenizer
  include_context_in_budget: true
  include_special_tokens_in_budget: true
  preserve_original_coordinates: true
  silent_truncation: false  # only the explicit cell-prefix rule below discards content
  cell_value_max_tokens: 100
  cell_value_scope: [table_data_cell_text, infobox_field_value]
  cell_value_tokenizer: native_bge_m3_tokenizer
  cell_value_include_special_tokens: false
  cell_value_overflow: keep_first_100_tokens_discard_tail
  cell_value_truncation_stage: rendered_retrieval_value_before_chunk_packing
  preserve_full_source_for_generation: true
  overlap: 0  # body content; repeated title/header context is allowed
  pack_within_source_only: true
  table_policy: pack_complete_rows_with_all_columns
  repeat_context: [page_title, section_path, caption, relevant_column_headers, source_row_index]
  wide_row_policy: greedy_consecutive_columns_left_to_right_when_row_exceeds_budget
  repeat_identity_columns: false
  infobox_policy: pack_field_rows_and_repeat_entity_and_active_internal_header
  kg_qualifier_separator: '; '  # existing fixed serialization, not a new special token
  kg_statement_separator: "\n\n"
  remaining_context_or_kg_overflow: error_with_source_coordinates

index:
  backend: faiss
  device: cuda
  unify_source_types: true
  separate_per_embedding_model: true
  index_type: IndexFlatIP
  distance_metric: inner_product
  similarity: cosine  # inner product of L2-normalized document/query vectors
  vector_dtype: float32

retrieval:
  stages: 1
  reranker: false
  hybrid_search: false
  query_rewriting: false
  graph_traversal: false
  chunk_k: 5
  chunk_k_values: [5, 10, 20, 30, 40, 50, 60, 70, 80, 100]
  chunk_order: cosine_descending
  tie_breaking: pending_observation_in_trial
  context_selection: top_k_chunks_restore_complete_parents_then_deduplicate
  parent_order_in_context: first_occurrence_in_chunk_ranking
  refill_after_parent_deduplication: false
  evaluation_parent_k: 100
  parent_ranking: maximum_chunk_cosine
  evaluation_extra_candidates_enter_context: false

generation:
  backend: huggingface  # or openai_api
  input_modality: text
  context_overflow: report_error_without_automatic_k_or_evidence_changes
  k_context_policy_status: pending_trial
  silently_drop_context: false
  request_timeout_seconds: 60  # total wall-clock deadline for each generation attempt
  retry_delay_seconds: 5  # fixed delay before every retry, excluded from question latency
  retries: 3  # additional retries after the first attempt; at most four attempts
  retry_on: [transient_transport_error, rate_limit, temporary_server_error, request_timeout]
  retry_invalid_output_or_citation: false
  invalid_output_status: failed
  failed_prediction_policy: empty_answers_and_citations_with_only_legal_retrieved_ids
  prompts:
    system_file: ../prompts/system.txt
    user_file: ../prompts/answer.txt
    examples_file: ../prompts/examples.json
  few_shot_examples: 3
  prompt_status: defined
  response_format: json_answers_and_citation_labels
  huggingface:
    model_id: unsloth/Qwen3.8-27B-unsloth-bnb-4bit
    repository_url: https://huggingface.co/unsloth/Qwen3.8-27B-unsloth-bnb-4bit
    download_source: huggingface
    revision: '8aa5f05d26b7205477066e1449e0af13f762a299'
    metadata_checked_on: '2026-11-27'
    publisher: Unsloth
    chat_template: official_model_template
    inference_backend: transformers
    engine_version: '5.20.2'
    weight_format: mixed_nf4_bf16
    quantization: bitsandbytes_nf4
    bitsandbytes_version: '0.50.2'
    unquantized_dtype: bfloat16
    kv_cache_dtype: bfloat16
    reasoning_parser: qwen3
    profile: non_thinking  # thinking requires an explicit --mode override
    profile_source: https://huggingface.co/Qwen/Qwen3.8-27B/blob/37561816e66b5b9153b1b64c10968c18c1e6f4a0/README.md
    native_context_tokens: 262144  # input plus generated thinking/final output
    context_window_tokens: 16384
    input_token_budget: 8192
    max_new_tokens_by_mode:
      non_thinking: 8192
      thinking: 8192  # reasoning plus final answer
    budget_status: conservative_startup_pending_hardware_trial
    documentation_url: https://huggingface.co/unsloth/Qwen3.8-27B-unsloth-bnb-4bit
    speculative_decoding: false
    reasoning_output_policy: separate_final_json_count_reasoning_tokens_and_discard_reasoning_text
    sampling_profiles:
      non_thinking:
        enable_thinking: false
        preserve_thinking: true
        do_sample: true
        temperature: 0.7
        top_p: 0.80
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repetition_penalty: 1.0
      thinking:
        enable_thinking: true
        reasoning_effort: xhigh
        preserve_thinking: true
        do_sample: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
    require_all_profile_parameters_supported: true
  openai_api:
    model_id: gpt-6-luna
    model_snapshot: null  # no separate dated snapshot is currently documented
    base_url: https://api.openai.com/v1
    endpoint: responses
    api_key_env: OPENAI_API_KEY  # environment variable name, never a key value
    request_timeout_seconds: 60  # mirrors the common per-attempt total deadline
    transport_auto_retries: 0  # all retries must be visible in method telemetry
    parameters: {}  # provider-default generation parameters; record returned settings
    request_options:  # explicit tool/storage controls, not sampling overrides
      tools: []
      tool_choice: none
      store: false
    documented_default_reasoning_effort: medium
    seed_parameter: unsupported_in_current_responses_schema
    docs_checked_on: '2026-11-14'
    lifecycle_at_check: active
    announced_shutdown_date: null
    documentation_url: https://developers.openai.com/api/docs/models/gpt-6-luna

telemetry:
  trace_protocol: navreg-trace-v1
  metrics: [llm_tokens_per_question, llm_calls_per_question, end_to_end_latency]
  latency_aggregation: mean
  exclude_retry_wait_from_latency: true
  record_retry_wait_seconds: true
  record_all_attempts: true
  unknown_usage: null
  input_tokens_scope: complete_actual_prompt_including_cached_input
  output_tokens_scope: all_generated_tokens_including_reasoning_and_final_content
  reasoning_tokens_are_subset_of_output_tokens: true
  reasoning_token_count_source: engine_usage_or_actual_generated_token_boundaries
  persist_reasoning_text: false
  response_storage: final_response_text_and_allowlisted_metadata_only

execution:
  questions_per_complete_experiment: 500
  index_storage: files_on_disk
  index_loading: independent_ram_and_gpu_copy_per_run
  gpu_index_concurrency: single_owner_with_serialized_calls_or_batching
  runs_per_command: 1  # one full 500-question experiment; no automatic repetition
  run_seed: 0  # --seed overrides experiment execution.run_seed, then this default
  question_order: seeded_shuffle_of_sorted_question_ids
  local_question_seed: integer_linear_combination_v1
  checkpoint: persist_each_question_and_all_attempts
  resume: skip_committed_terminal_questions_with_identical_config
  remote_inflight_on_crash: retain_attempt_and_unknown_usage_do_not_claim_exactly_once
